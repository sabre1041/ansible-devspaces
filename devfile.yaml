schemaVersion: 2.3.0
attributes:
  controller.devfile.io/storage-type: per-workspace
metadata:
  name: ansible-devspaces
components:
  - name: dev-tools
    container:
      image: quay.io/ablock/ansible-devspaces:ansible-superlab
      cpuLimit: 4000m
      cpuRequest: 250m
      memoryRequest: 128Mi
      memoryLimit: 8Gi
      env:
        - name: HOME
          value: "/projects"
        - name: VSCODE_DEFAULT_WORKSPACE
          value: "/projects/ansible-devspaces/.code-workspace"
        - name: "ADT_CONTAINER_ENGINE"
          value: "podman"
  - volume:
      size: 50Gi
    name: projects
  - name: prep-workspace
    container:
      args:
        - '-c'
        - >-
          curl -fsSL https://opencode.ai/install | bash
      command:
        - /bin/bash
      image: image-registry.openshift-image-registry.svc:5000/openshift/cli:latest
      mountSources: true
      sourceMapping: /projects
      memoryRequest: 256Mi
      memoryLimit: 512Mi
      cpuRequest: 100m
      cpuLimit: 500m
      env:
      - name: HOME
        value: "/projects"
commands:
- apply:
    component: prep-workspace
    label: Pre Start Prep
  id: prep-workspace
events:
  preStart:
    - prep-workspace